<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If Else conditions</title>
</head>
<body>
    <div class="container-fluid">
        <h1>Practice If Else conditions</h1>
        <div class="row mt-5">
            <div class=" box col-4">
                <div class="form-action">
                    <label for="age">Enter your age:</label>
                    <input type="text" id="age" class="form-control" placeholder="Enter your age">
                    <button class="btn btn-primary mt-3" onclick="eligibality()">Check Eligibility</button>
                        <p id="result"></p>
                </div>
            </div>
            <div class="box col-4">
                <div class="form-action">
                    <label for="num">Enter a number:</label>
                    <input type="text" id="num" class="form-control" placeholder="Enter a number">
                    <button class="btn btn-primary mt-3" onclick="checkNumber()">Check Number</button>
                    <p id="numResult"></p>
                </div>
            </div>
            <div class="box col-4">
                <div class="form-action">
                    <label for="num1">Enter a Number</label>
                    <input type="text" id="num1" class="form-control" placeholder="Enter a number">
                    <button class="btn btn-primary mt-3" onclick="checkGreater()">Check Number</button>
                    <p id="checkResult"></p>
                </div>
            </div>
        </div>
    </div> <hr style="border:5px solid black" >
    <div class="container-fluid">
        <h1>Practice If Else conditions Part 2</h1>
        <div class="row mt-5">
            <div class="box col-4">
                <div class="form-action">
                   
                        <label for="email">Enter Your Email: </label>
                        <input type="email" id="email" class="form-control" placeholder="Enter your email">
                        <label for="password">Enter Your Password: </label>
                        <input type="password" id="password" class="form-control" placeholder="Enter your password">
                        <button class="btn btn-primary mt-3" onclick="validateLogin()">Login</button>
                        <p id="loginResult"></p>
                    </div>
                </div>
            <br>
            <div class="box col-4">
                <div class="form-action">
                    <label for="num3">Enter a number:</label>
                    <input type="text" id="num3" class="form-control" placeholder="Enter a number">
                    <button class="btn btn-primary mt-3" onclick ="devideByFive()">Click here</button>
                    <p class="Answer"></p>
                </div>
            </div>
            <div class="box col-4">
                <div class="form-action">
                    <label for="number1">Enter a number:</label>
                    <input type="text" id="number1" class="form-control" placeholder="Enter a number">
                    <label for="number2">Enter another number:</label>
                    <input type="text" id="number2" class="form-control" placeholder="Enter another number">
                    <label for="number3">Enter a third number:</label>
                    <input type="text" id="number3" class="form-control" placeholder="Enter a third number">

                    <button class="btn btn-primary mt-3" onclick="largeNum()">Check Largest Number</button>
                    <p id="largestResult"></p>
                </div>
            </div>
        </div>
    </div><hr style="border:5px solid black" >
    <div class="container-fluid">
        <h1>Practice If Else conditions Last part</h1>
        <div class="row mt-5">
            <div class="box col-6">
                <div class="form-control">
                    <label for="val">Enter a value:</label>
                    <input type="text" id="val" class="form-control" placeholder="Enter a value">
                    <button class="btn btn-primary mt-3" onclick="checkPrime()">Click Here</button>
                    <p id="primeResult"></p>
                </div>
            </div>
            <div class="box col-6">
                <div class="form-control">
                    <label for="units">Enter Units Consumed:</label>
                    <input type="text" id="units" class="form-control" placeholder="Enter Units Consumed">
                    <button class="btn btn-primary mt-3" onclick="Billing()">Calculate Bill</button>
                    <p id="billingResult"></p>
                </div>
            </div>
        </div>
    </div><hr style="border:5px solid black" >
<script src="Practice_js.js"></script>
</body>
</html>
