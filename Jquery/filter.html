<html>
    <head>
        <title>filter function</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script>
            $(document).ready(function(){
                $("p").filter(".myfun").css("background-color","yellow");
            });
        </script>
    </head>
    <body>
        <p>This is first paragraph</p>
        <p class="myfun">This is Another paragragh</p>
        <p class="myfun">This is Eq function paragraph</p>
        <p>Hello World</p>
    </body>
</html>
