<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerHtml In js</title>

    <script>
        function inner_html() {
        document.getElementById("demo").innerHTML="Hello JavaScript";
        }
    </script>
</head>
<body>
    <button onclick="inner_html()">Click Here</button>
    <p id="demo"></p>
</body>
</html>
