<html>
    <head>
        <title>Empty tag</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script>
            $(document).ready(function(){
                $("button").click(function(){
                    $("#Content").empty();
                })
            })
        </script>
    </head>
    <body>
        <div id="Content" style="border: 2px solid #000;">Lorem ipsum dolor sit amet consectetur adipisicing elit. Blanditiis, expedita consequuntur. Repellat totam esse molestias, provident at quisquam ducimus, nisi adipisci veniam earum temporibus dolore. Minima laudantium porro tenetur sapiente.</div>
        <br>
        <button type="button">Click for empty text</button>
    </body>
</html>
