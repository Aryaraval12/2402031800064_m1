<html>
    <head>
        <title>Hide Keyword</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <script>
            $(document).ready(function(e){
                $("#hide").click(function(e){
                    $("p").hide();
                });
                $("#show").click(function(e){
                    $("p").show();
                });
            });
        </script>
    </head>
    <head>
        <div class="container">
            <div class="row">
                <div class="col"></div>
                <div class="col">
                    <button type="button" id="hide" class="btn btn" style="background-color: #576;" >Click Here</button>
                    <button type="button" id="show" class="btn btn" style="background-color: #84A;" >Click Here</button>
                    <p>This text is been hide</p>
                </div>
                <div class="col"></div>
            </div>
        </div>
    </head>
</html>
