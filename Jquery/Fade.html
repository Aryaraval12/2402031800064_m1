<html>
    <head>
        <title>Fade</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <script>
            $(document).ready(function(e){
                $("button").click(function(e){
                    $("#div1").fadeIn();
                    $("#div2").fadeIn("slow");
                    $("#div3").fadeIn(2500);
                });
            });
        </script>
    </head>
    <body>
        <button class="btn btn" style="background-color: #789A99;" >Click here</button>
        <br><br>
        <div id="div1" style="width:80px;height:80px;display:none;background-color:#233D4C;"></div><br>
        <div id="div2" style="width:80px;height:80px;display:none;background-color:#FDB02E;"></div><br>
        <div id="div3" style="width:80px;height:80px;display:none;background-color:#F1E194;"></div>
    </body>
</html>
