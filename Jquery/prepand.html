<html>
    <head>
        <title>
            appand in jquery
        </title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

        <script>
            $(document).ready(function(e){
                $("#btn1").click(function(e){
                    $("p").prepend("<b>Appand Text</b>")
                });
                $("#btn2").click(function(e){
                    $("ol").prepend("<li>Appand List</li>")
                });
            });
        </script>
    </head>
    <body>
        <p>This is a paragraph</p>
        <p>This is another paragraph</p>
        <ol>
            <li>List item 1</li>
            <li>List item 2</li>
            <li>List item 3</li>
        </ol>
        <button type="button" id="btn1">Add sentence</button>
        <button type="button"id=btn2>Add List item</button>
    </body>
</html>
