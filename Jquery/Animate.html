<html>
    <head>
        <title>Animation</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <script>
            $(document).ready(function(e){
                $("button").click(function(e){
                    $("#animation").animate({left:'650px'})
                });
            });
        </script>
    </head>
    <body>
        <button type="button" class="btn btn" style="background-color:#FFD700;font-family:'fantasy'" >click Here</button> 
        <div style="background:rgba(43, 41, 41, 0.2);height:100px;width:100px;position:absolute;margin-top:150px;" id="animation"></div>
    </body>
</html>
