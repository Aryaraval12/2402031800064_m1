<html>
    <head>
        <title>Some IMP Tags</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        
      
    </head>
    <body>
        <div class="container-fluid">
            <div class="row">
                <div class="col">
                    <h1>Click Here</h1>
                    <button type="button" class="btn btn-primary" data-bs-toggle="tooltip" title="Hooray!">Hover Over Me</button>
                </div>
                <div class="col">
                    <h1>Click Here</h1>
                    <button type="button"class="btn btn-primary" data-bs-toggle="popover" title="Popover Header" data-bs-content="Hello...How Are You!!">Popover</button>
                </div>
                <div class="col">
                    <h1>Toast Tag</h1>
                    <div class="toast show">
                        <div class="toast-header">
                            <strong class="me-auto">Toast Header</strong>
                            <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
                        </div>
                        <div class="toast-body">
                          <p>Hello...How are you!!</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
          <script>
            var popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'))
            var popoverList = popoverTriggerList.map(function (popoverTriggerEl) {
              return new bootstrap.Popover(popoverTriggerEl)
            })
        </script>
        <script>
            var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
            var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
              return new bootstrap.Tooltip(tooltipTriggerEl)
            })
        </script>
    </body>
</html>
